<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4570"/>
      <stop offset="100%" stop-color="#17273F"/>
    </linearGradient>
    <linearGradient id="irisMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4423"/><stop offset="16%" stop-color="#B87333"/>
      <stop offset="34%" stop-color="#6B4423"/><stop offset="50%" stop-color="#E8C39E"/>
      <stop offset="64%" stop-color="#B87333"/><stop offset="82%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#E8C39E"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5D687"/>
      <stop offset="100%" stop-color="#D1AC00"/>
    </radialGradient>
  </defs>

  <!-- App-Icon-Hintergrund: IRIS-Digital-Charcoal-Gradient (1:1 aus iris-web lw-hero) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- IRIS-Aperture-Blätter: 1:1-Geometrie aus iris-web/index.html, auf 512er-Raster skaliert -->
  <g fill="url(#irisMetal)">
    <rect x="237.7" y="45.7" width="36.6" height="164.6" rx="18" transform="rotate(0 256 256)"/>
    <rect x="237.7" y="45.7" width="36.6" height="164.6" rx="18" transform="rotate(60 256 256)"/>
    <rect x="237.7" y="45.7" width="36.6" height="164.6" rx="18" transform="rotate(120 256 256)"/>
    <rect x="237.7" y="45.7" width="36.6" height="164.6" rx="18" transform="rotate(180 256 256)"/>
    <rect x="237.7" y="45.7" width="36.6" height="164.6" rx="18" transform="rotate(240 256 256)"/>
    <rect x="237.7" y="45.7" width="36.6" height="164.6" rx="18" transform="rotate(300 256 256)"/>
  </g>

  <!-- Holiday-Akzent: Sonnenstrahlen in den Lücken zwischen den Aperture-Blättern -->
  <g fill="url(#sunGrad)">
    <rect x="246" y="108" width="20" height="58" rx="10" transform="rotate(30 256 256)"/>
    <rect x="246" y="108" width="20" height="58" rx="10" transform="rotate(90 256 256)"/>
    <rect x="246" y="108" width="20" height="58" rx="10" transform="rotate(150 256 256)"/>
    <rect x="246" y="108" width="20" height="58" rx="10" transform="rotate(210 256 256)"/>
    <rect x="246" y="108" width="20" height="58" rx="10" transform="rotate(270 256 256)"/>
    <rect x="246" y="108" width="20" height="58" rx="10" transform="rotate(330 256 256)"/>
  </g>

  <!-- Sonnen-Kern -->
  <circle cx="256" cy="256" r="58.5" fill="url(#sunGrad)"/>
</svg>
